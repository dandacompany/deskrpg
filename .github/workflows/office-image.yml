name: Office image

# deskrpg-office — an image with the office (DeskRPG) and the brain (Hermes Agent) in one container.
#
# Why this is separate from release.yml: this image is not a DeskRPG release; it is baked on top of
# `deskrpg@latest` and the official Hermes image. So it must be bakeable from a release tag or by hand
# (rebaking without a release when the official Hermes image moves).
#
# amd64 only. The arm64 variant of the official Hermes image is stuck at a 2026-06 version (measured v0.16.0)
# and the plugin does not load. The target is amd64 VPSes.
on:
  push:
    tags: ["20[0-9][0-9].[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "버전 태그 (예: 2026.9.20). 비우면 latest 만 민다."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: office-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dandacompany/deskrpg-office

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: meta
        # Pass inputs as environment variables, not shell code (prevents script injection).
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="$INPUT_VERSION"
          case "$V" in
            "" ) ;;
            20[0-9][0-9].[0-9]*.[0-9]* ) ;;
            * ) echo "version 은 날짜 태그 형식이어야 합니다: $V" >&2; exit 1 ;;
          esac
          if [ -z "$V" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME}"; fi
          TAGS="$IMAGE:latest"
          [ -n "$V" ] && TAGS="$TAGS,$IMAGE:$V"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/office
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
      # It must be pullable anonymously to serve as the Compose default.
      - name: Verify anonymous pull
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          TOK="$(curl -sf "https://ghcr.io/token?scope=repository:dandacompany/deskrpg-office:pull&service=ghcr.io" | jq -r .token)"
          for ref in latest $VERSION; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/dandacompany/deskrpg-office/manifests/$ref")"
            echo "$ref -> HTTP $code"
            [ "$code" = "200" ] || { echo "$ref 를 익명으로 당길 수 없습니다. 패키지 공개 설정을 확인하세요." >&2; exit 1; }
          done
