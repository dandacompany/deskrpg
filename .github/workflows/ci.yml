name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel the previous run when a new push lands on the same branch — no reason to wait for stale results.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The migration test (src/db/npc-profile-migration.test.ts) runs only when a temporary PostgreSQL
    # is available. Without that service the test ran nowhere and the suite was green
    # with skipped 1 — even though production is PostgreSQL and this migration is exactly
    # where NPC deletion and backfill happen.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deskrpg
          POSTGRES_PASSWORD: migtest
          POSTGRES_DB: deskrpg
        ports:
          - 55437:5432
        options: >-
          --health-cmd "pg_isready -U deskrpg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: 공개 트리 메타 파일 검사
        run: bash scripts/check-public-tree.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Keep running the rest on failure — seeing everything that broke at once is cheaper
      # than repeating "fix, push again, see the next failure".
      - name: 단위 테스트
        if: always()
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://deskrpg:migtest@127.0.0.1:55437/deskrpg
        run: npm run test

      - name: 타입 검사
        if: always()
        run: npm run typecheck

      # Brought to 0 on 2026-09-07. While this step was missing, 17 react-hooks/exhaustive-deps
      # violations lived in the tile editor, and several were real defects
      # (e.g. the layer overlay toggle did not redraw the canvas).
      #
      # Warnings (unused variables, etc.) do not fail — only errors are gated. Blocking warnings too
      # would first require bringing them to 0, which is a separate task.
      - name: 린트
        if: always()
        run: npm run lint

      # The most valuable gate in this repo. Code importing a module that did not exist once
      # survived four months (ec60ca2d) — unit tests do not import that route, and the
      # dev server compiles only requested routes, so only a full build sees it.
      - name: 빌드
        if: always()
        run: npm run build

      - name: 포매팅
        if: always()
        run: npm run format:check

  # Windows-only runtime paths — the PowerShell launcher, the ANSI code page, ssh.exe's pipe stalls,
  # null stdio streams, ACLs and WMI daemons. Six Windows defects once passed every test on Linux,
  # because the tests pinned argument shapes and faked spawn; this job runs the real processes.
  # The runtime tests skip themselves on other platforms, so this is the only place they run.
  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Windows 런타임 테스트
        run: npm run test:windows

  game-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e:fixtures
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: game-fixture-traces
          path: .artifacts/game-fixtures/test-results
          include-hidden-files: true
          retention-days: 7

  # Check that the runtime image actually builds.
  #
  # The verify job cannot see this layer. Unit tests read the .ts sources directly, so every file
  # is there, and `next build` only bundles the app and ignores the Dockerfile COPY list.
  # That is how a Dockerfile that kept COPYing a deleted file survived four months, and how the
  # runtime modules added in phase 2 went missing wholesale until deploy time.
  #
  # The runner is amd64 and so is the deploy target (MiniPC, x86_64), so the architecture matches.
  # On master pushes the same build is pushed to GHCR with a SHA tag. That is only a production
  # candidate, not a deploy. Promotion to production is done separately once both verify and docker are green.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: 공개 트리 메타 파일 검사
        run: bash scripts/check-public-tree.sh

      - uses: docker/setup-buildx-action@v4

      - name: GHCR 로그인 (master 푸시만)
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 런타임 이미지 빌드
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/dandacompany/deskrpg:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must run its own CLI, not just the server: create-user and reset-password require
      # modules (bcryptjs) that Next's standalone tracing does not place in node_modules. Load the same
      # build (cache hit) and run both commands against a real SQLite runtime home.
      - name: 스모크용 이미지 적재
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: deskrpg-ci:smoke
          cache-from: type=gha

      - name: 컨테이너 안 CLI 스모크 (create-user · reset-password)
        run: bash scripts/docker-cli-smoke.sh deskrpg-ci:smoke

      - name: 운영 후보 익명 pull 확인
        if: github.event_name == 'push'
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "ghcr.io/dandacompany/deskrpg:sha-${GITHUB_SHA}" > /dev/null
