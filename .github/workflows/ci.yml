name: CI

on:
  push:
    branches: [master]
  pull_request:

# 같은 브랜치에 새 푸시가 오면 이전 실행을 취소한다 — 오래된 결과를 기다릴 이유가 없다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 실패해도 나머지를 계속 돌린다 — 한 번에 무엇이 깨졌는지 전부 보이는 편이
      # "고치고 다시 밀고 다음 실패를 본다"를 반복하는 것보다 싸다.
      - name: 단위 테스트
        if: always()
        run: npm run test

      - name: 타입 검사 (소스만)
        if: always()
        run: npm run typecheck

      # 이 저장소에서 가장 값진 게이트다. 없는 모듈을 import 하는 코드가 넉 달을
      # 살아남은 적이 있다(ec60ca2d) — 단위 테스트는 그 라우트를 import 하지 않고,
      # dev 서버는 요청된 라우트만 컴파일하므로 전체 빌드만이 그걸 본다.
      - name: 빌드
        if: always()
        run: npm run build

      - name: 포매팅
        if: always()
        run: npm run format:check

  # 런타임 이미지가 실제로 빌드되는지 본다.
  #
  # verify 잡으로는 이 층을 못 본다. 단위 테스트는 .ts 소스를 직접 읽으므로 파일이
  # 다 있고, `next build` 는 앱을 번들할 뿐 Dockerfile 의 COPY 목록과 무관하다.
  # 그래서 삭제된 파일을 계속 COPY 하던 Dockerfile 이 넉 달을 살아남았고, 2단계에서
  # 늘어난 런타임 모듈이 통째로 빠진 것도 배포 때서야 드러났다.
  #
  # 러너는 amd64 이고 배포 대상(MiniPC)도 x86_64 라 아키텍처가 맞는다.
  # 여기서는 빌드만 한다 — 푸시는 릴리스 파이프라인의 몫이다.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 런타임 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
