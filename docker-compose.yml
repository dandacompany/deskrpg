# Hostinger compose: keep in repo root and under Docker Manager's 8192-byte limit.

services:
  deskrpg:
    image: ${DESKRPG_IMAGE:-ghcr.io/dandacompany/deskrpg:latest}
    restart: unless-stopped
    depends_on:
      - hermes
    environment:
      DB_TYPE: sqlite
      SQLITE_PATH: /app/data/deskrpg.db
      # In the volume so a generated JWT_SECRET survives Update.
      DESKRPG_HOME: /app/data/home
      # No default: a shared default would be a public signing key.
      JWT_SECRET: ${JWT_SECRET:-}
      DESKRPG_EDUCATION_WORKFLOW_TOKEN: ${DESKRPG_EDUCATION_WORKFLOW_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      INTERNAL_HOSTNAME: 0.0.0.0
      # Web UI host setup: admins by default, 0 turns it off.
      DESKRPG_HOST_SETUP_ENABLED: ${DESKRPG_HOST_SETUP_ENABLED:-1}
    volumes:
      - deskrpg-data:/app/data
    labels:
      - traefik.enable=true
      # Bridge-mode Traefik dials the `traefik-proxy` IP.
      - traefik.docker.network=traefik-proxy
      # /socket.io -> 3001, everything else -> Next.js 3000 (same origin).
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}-ws.rule=Host(`${COMPOSE_PROJECT_NAME:-deskrpg}.${TRAEFIK_HOST:-localhost}`) && PathPrefix(`/socket.io`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}-ws.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}-ws.tls.certresolver=letsencrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}-ws.priority=20
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}-ws.service=${COMPOSE_PROJECT_NAME:-deskrpg}-ws
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-deskrpg}-ws.loadbalancer.server.port=3001
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}.rule=Host(`${COMPOSE_PROJECT_NAME:-deskrpg}.${TRAEFIK_HOST:-localhost}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}.tls.certresolver=letsencrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}.priority=10
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}.service=${COMPOSE_PROJECT_NAME:-deskrpg}
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-deskrpg}.loadbalancer.server.port=3000

  traefik-connect:
    image: docker:29-cli
    restart: "no"
    depends_on:
      - deskrpg
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - |
        docker network inspect traefik-proxy >/dev/null 2>&1 || { echo "traefik-proxy not found (host-mode Traefik or none): nothing to do"; exit 0; }
        project=$$(docker inspect "$$HOSTNAME" --format '{{ index .Config.Labels "com.docker.compose.project" }}')
        [ -n "$$project" ] || { echo "cannot read own compose project label"; exit 1; }
        for service in deskrpg hermes; do
          for id in $$(docker ps -q --filter "label=com.docker.compose.project=$$project" --filter "label=com.docker.compose.service=$$service"); do
            if docker network connect traefik-proxy "$$id" 2>/tmp/err; then echo "joined traefik-proxy: $$service"
            elif grep -qi "already exists" /tmp/err; then echo "already on traefik-proxy: $$service"
            else cat /tmp/err; exit 1; fi
          done
        done

  plugin-pin:
    image: ${DESKRPG_IMAGE:-ghcr.io/dandacompany/deskrpg:latest}
    restart: "no"
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - sed -n 's/^export const PLUGIN_PIN = "\([0-9a-f]\{40\}\)";$$/\1/p' src/lib/hermes/setup/pin.ts > /pin/ref
    volumes:
      - plugin-pin:/pin

  hermes-plugins:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    restart: "no"
    depends_on:
      plugin-pin:
        condition: service_completed_successfully
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      API_SERVER_KEY: ${HERMES_API_KEY:-change-this-hermes-api-key}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DESKRPG_EDUCATION_WORKFLOW_TOKEN: ${DESKRPG_EDUCATION_WORKFLOW_TOKEN:-}
      DESKRPG_EDUCATION_WORKFLOW_API_URL: http://deskrpg:3000
      DESKRPG_EDUCATION_WORKFLOW_URL: https://${COMPOSE_PROJECT_NAME:-deskrpg}.${TRAEFIK_HOST:-localhost}
    volumes:
      - hermes-data:/opt/data
      - plugin-pin:/pin:ro
    command:
      - sh
      - -c
      - |
        set -e
        touch /opt/data/.env
        for v in OPENROUTER_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY DESKRPG_EDUCATION_WORKFLOW_TOKEN DESKRPG_EDUCATION_WORKFLOW_API_URL DESKRPG_EDUCATION_WORKFLOW_URL; do
          val=$$(printenv "$$v" || true)
          [ -n "$$val" ] || continue
          grep -v "^$$v=" /opt/data/.env > /tmp/env.next || true
          printf '%s=%s\n' "$$v" "$$val" >> /tmp/env.next
          cat /tmp/env.next > /opt/data/.env
        done
        u=https://github.com/dandacompany/deskrpg-hermes-plugin; d=/opt/data/plugins/deskrpg; p="hermes plugins"
        pin=$$(cat /pin/ref 2>/dev/null || true); h=$$(git -c safe.directory='*' -C $$d rev-parse HEAD 2>/dev/null || true)
        if [ -n "$$pin" ] && [ "$$h" != "$$pin" ]; then
          $$p disable deskrpg || true
          $$p install $$u --ref "$$pin" --force --no-enable || [ -d $$d ]
        elif [ ! -d $$d ]; then $$p install $$u --no-enable; fi
        $$p enable deskrpg || { [ -n "$$h" ] && $$p install $$u --ref "$$h" --force --no-deps && $$p enable deskrpg; }

  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    restart: unless-stopped
    command: ["gateway", "run"]
    depends_on:
      hermes-plugins:
        condition: service_completed_successfully
      plugin-pin:
        condition: service_completed_successfully
        restart: true
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:-change-this-hermes-api-key}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DESKRPG_EDUCATION_WORKFLOW_TOKEN: ${DESKRPG_EDUCATION_WORKFLOW_TOKEN:-}
      DESKRPG_EDUCATION_WORKFLOW_API_URL: http://deskrpg:3000
      DESKRPG_EDUCATION_WORKFLOW_URL: https://${COMPOSE_PROJECT_NAME:-deskrpg}.${TRAEFIK_HOST:-localhost}
      HERMES_DASHBOARD: ${HERMES_DASHBOARD_PASSWORD:+true}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USER:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:-}
      HERMES_DASHBOARD_PUBLIC_URL: https://${COMPOSE_PROJECT_NAME:-deskrpg}-hermes.${TRAEFIK_HOST:-localhost}
    volumes:
      - hermes-data:/opt/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}-hermes.rule=Host(`${COMPOSE_PROJECT_NAME:-deskrpg}-hermes.${TRAEFIK_HOST:-localhost}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}-hermes.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}-hermes.tls.certresolver=letsencrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}-hermes.service=${COMPOSE_PROJECT_NAME:-deskrpg}-hermes
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-deskrpg}-hermes.loadbalancer.server.port=9119

volumes:
  deskrpg-data:
  hermes-data:
  plugin-pin:
