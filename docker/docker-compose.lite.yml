# docker/docker-compose.lite.yml — SQLite mode (no external DB needed)
# Lightweight single-container deployment. Ideal for self-hosting without PostgreSQL.
services:
  deskrpg-app:
    image: ${DESKRPG_IMAGE:-ghcr.io/dandacompany/deskrpg:latest}
    container_name: deskrpg-app
    restart: unless-stopped
    ports:
      - "3102:3000"
      - "3103:3001"
    volumes:
      - ../public/assets:/app/public/assets
      - deskrpg-data:/app/data
    environment:
      DB_TYPE: sqlite
      SQLITE_PATH: /app/data/deskrpg.db
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    # Pin the Hermes gateway running on the host (default 8642) by name.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  deskrpg-data:
